<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>インクチェック判定 v1.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:auto;padding:14px}
h1{font-size:24px;margin:4px 0}.sub{font-size:13px;color:#666}
.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #00000012}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}
.primary{background:#111;color:#fff}.secondary{background:#e5e7eb;color:#111}
input[type=file]{position:absolute;left:-9999px}
#stage{display:none;position:relative;width:100%;margin-top:10px;border-radius:12px;overflow:hidden;background:#ddd}
#photoCanvas{display:block;width:100%;height:auto}
#overlay{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#f7f7f7;border-radius:12px;padding:10px;text-align:center}
.big{font-size:32px;font-weight:900}
.status{margin-top:10px;padding:16px;border-radius:14px;text-align:center;font-size:28px;font-weight:900;background:#eee}
.ok{background:#dcfce7}.ng{background:#fee2e2}.warn{background:#fef3c7}.info{background:#dbeafe}
.small{font-size:13px;color:#666;line-height:1.55}
.previewGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.previewGrid canvas{width:100%;background:#eee;border-radius:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>インクチェック判定</h1>
<div class="sub">v1.2 / グリッド線検出版 / 外部ライブラリなし</div>

<div class="card">
<label class="btn primary" for="photo">2本を撮影 / 写真を選ぶ</label>
<input id="photo" type="file" accept="image/*" capture="environment">
<div id="loadmsg" class="small">画像未選択</div>

<div id="stage">
  <canvas id="photoCanvas"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div class="row">
  <button id="resetBtn" class="btn secondary" disabled>枠を初期位置へ</button>
  <button id="judgeBtn" class="btn primary" disabled>この位置で判定</button>
</div>
<div class="small" style="margin-top:8px">
緑＝左、青＝右。4つの丸を「チェック表の四隅」に合わせてください。<br>
表全体（C/M/Y/K、W/CL/LC/LM、左右の空欄）が入るように合わせます。
</div>
</div>

<div class="card">
<div class="results">
  <div class="box">左<div id="left" class="big">-</div><div id="scoreL" class="small"></div></div>
  <div class="box">右<div id="right" class="big">-</div><div id="scoreR" class="small"></div></div>
</div>
<div id="status" class="status">写真を選んでください</div>

<div class="previewGrid">
  <canvas id="warpL" width="400" height="400"></canvas>
  <canvas id="warpR" width="400" height="400"></canvas>
</div>
<div class="small">赤枠＝「✓がある」と判断したマス。オレンジ枠＝自信が低い場合。</div>
</div>

<div class="card small">
<b>この版の違い</b><br>
LMなどの文字を✓と誤認しないよう、補正後の表から縦の罫線を検出して「本当のチェック欄」だけを切り出します。<br>
外部AI・OpenCVは使いません。PCではindex.htmlを直接開いて試せます。
</div>
</div>

<script src="app.js"></script>
</body>
</html>
